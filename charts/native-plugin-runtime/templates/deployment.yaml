{{- if and .Values.enabled .Values.runtime.enabled }}
{{- if and .Values.ui.enabled (eq (int .Values.ui.port) (int .Values.plugin.port)) }}
{{- fail "UI and plugin ports must be different" }}
{{- end }}
{{- if and .Values.ui.enabled .Values.networkPolicy.enabled (eq (len .Values.networkPolicy.additionalIngress) 0) }}
{{- fail "ui.enabled with networkPolicy.enabled requires an exact UI Gateway peer and ui.port rule in networkPolicy.additionalIngress" }}
{{- end }}
{{- if .Values.workloadIdentity.enabled }}
{{- if not .Values.serviceAccount.create }}
{{- fail "workloadIdentity requires the chart's own ServiceAccount (serviceAccount.create=true): an IAM workload binding names exactly one ServiceAccount per installation" }}
{{- end }}
{{- if semverCompare "<1.29.0-0" .Capabilities.KubeVersion.Version }}
{{- fail "workloadIdentity runs the token exchange as a native sidecar and requires Kubernetes 1.29 or newer" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "native-plugin-runtime.fullname" . }}
  labels:
    {{- include "native-plugin-runtime.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "native-plugin-runtime.runtimeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "native-plugin-runtime.runtimeSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        stellwerk.dev/plugin-package: {{ .Values.package.reference | quote }}
        stellwerk.dev/plugin-trust-mode: {{ .Values.trust.mode | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "native-plugin-runtime.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "native-plugin-runtime.fetchInitContainers" . | nindent 8 }}
        {{- if .Values.workloadIdentity.enabled }}
        # Native sidecar: started after validation, the plugin starts only once
        # its startup probe sees a valid Core token. Only this container
        # mounts the projected ServiceAccount token.
        - name: core-token
          image: {{ .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          restartPolicy: Always
          args:
            - refresh-core-token
            - --gateway-url={{ .Values.workloadIdentity.gateway.url }}
            - --subject-token-file=/var/run/secrets/stellwerk/workload/token
            - --token-file=/run/stellwerk/core-token/token
            {{- if .Values.workloadIdentity.gateway.caSecret.name }}
            - --ca-file=/run/stellwerk/gateway-ca/ca.crt
            {{- end }}
          startupProbe:
            exec:
              command: [/runtime, check-core-token, --token-file=/run/stellwerk/core-token/token]
            periodSeconds: 2
            failureThreshold: 150
          readinessProbe:
            exec:
              command: [/runtime, check-core-token, --token-file=/run/stellwerk/core-token/token]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.workloadIdentity.resources | nindent 12 }}
          volumeMounts:
            - name: workload-token
              mountPath: /var/run/secrets/stellwerk/workload
              readOnly: true
            - name: core-token
              mountPath: /run/stellwerk/core-token
            {{- if .Values.workloadIdentity.gateway.caSecret.name }}
            - name: gateway-ca
              mountPath: /run/stellwerk/gateway-ca
              readOnly: true
            {{- end }}
        {{- end }}
      containers:
        - name: plugin
          image: {{ required "images.runtime is required" .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - run
            {{- include "native-plugin-runtime.commonArgs" . | nindent 12 }}
            - --listen=0.0.0.0:{{ .Values.plugin.port }}
            - --plugin-state=/state
          {{- if or .Values.pluginEnv .Values.workloadIdentity.enabled }}
          env:
            {{- if .Values.workloadIdentity.enabled }}
            - name: STELLWERK_CORE_TOKEN_FILE
              value: /run/stellwerk/core-token/token
            {{- end }}
            {{- with .Values.pluginEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.plugin.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path | quote }}
              scheme: {{ .Values.probes.scheme }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path | quote }}
              scheme: {{ .Values.probes.scheme }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path | quote }}
              scheme: {{ .Values.probes.scheme }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
              readOnly: true
            - name: state
              mountPath: /state
            - name: temporary
              mountPath: /tmp
            {{- if .Values.workloadIdentity.enabled }}
            - name: core-token
              mountPath: /run/stellwerk/core-token
              readOnly: true
            {{- end }}
            {{- range .Values.pluginSecretFiles }}
            - name: {{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
        {{- if .Values.ui.enabled }}
        - name: ui
          image: {{ .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - serve-ui
            {{- include "native-plugin-runtime.commonArgs" . | nindent 12 }}
            - --listen=0.0.0.0:{{ .Values.ui.port }}
            - --console-origin={{ .Values.ui.consoleOrigin }}
          ports:
            - name: ui
              containerPort: {{ .Values.ui.port }}
          readinessProbe:
            httpGet: {path: /health, port: ui}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: ui}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
              readOnly: true
        {{- end }}
      volumes:
        - name: package
          emptyDir:
            sizeLimit: {{ .Values.packageVolume.sizeLimit }}
        {{- include "native-plugin-runtime.fetchVolumes" . | nindent 8 }}
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "native-plugin-runtime.fullname" . }}-state
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.stateVolume.sizeLimit }}
          {{- end }}
        {{- if .Values.workloadIdentity.enabled }}
        - name: workload-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.workloadIdentity.audience | quote }}
                  expirationSeconds: {{ .Values.workloadIdentity.expirationSeconds }}
                  path: token
        - name: core-token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if .Values.workloadIdentity.gateway.caSecret.name }}
        - name: gateway-ca
          secret:
            secretName: {{ .Values.workloadIdentity.gateway.caSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.workloadIdentity.gateway.caSecret.key }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- range .Values.pluginSecretFiles }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
            defaultMode: 0440
            items:
              {{- range .items }}
              - key: {{ .key }}
                path: {{ .path }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
