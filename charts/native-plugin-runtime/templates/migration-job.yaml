{{- if and .Values.enabled .Values.migration.enabled }}
{{- if .Values.runtime.enabled -}}
{{- fail "runtime.enabled must remain false while the migration phase is enabled" -}}
{{- end -}}
{{- $profileSecret := required "migration.profileSecret.name is required" .Values.migration.profileSecret.name -}}
{{- $databaseSecret := required "migration.databaseSecret.name is required" .Values.migration.databaseSecret.name -}}
{{- if eq $profileSecret $databaseSecret -}}
{{- fail "migration profile and database credentials must use separate Secrets" -}}
{{- end -}}
{{- $databaseCASecret := .Values.migration.databaseCASecret.name -}}
{{- if and $databaseCASecret (or (eq $databaseCASecret $profileSecret) (eq $databaseCASecret $databaseSecret)) -}}
{{- fail "migration database CA must use a separate public-only Secret" -}}
{{- end -}}
{{- range .Values.pluginSecretFiles -}}
{{- if or (eq .secretName $profileSecret) (eq .secretName $databaseSecret) -}}
{{- fail "migration Secrets must not be mounted into the runtime container" -}}
{{- end -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "native-plugin-runtime.fullname" . }}-migration
  labels:
    {{- include "native-plugin-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "native-plugin-runtime.migrationSelectorLabels" . | nindent 8 }}
      annotations:
        stellwerk.dev/plugin-package: {{ .Values.package.reference | quote }}
        stellwerk.dev/plugin-trust-mode: {{ .Values.trust.mode | quote }}
    spec:
      serviceAccountName: {{ include "native-plugin-runtime.migrationServiceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fetch-package-envelope
          image: {{ required "images.oras is required" .Values.images.oras | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - manifest
            - fetch
            - --output=/package/oci-manifest.json
            {{- if .Values.package.plainHTTP }}
            - --plain-http
            {{- end }}
            {{- if .Values.package.registryConfigSecret.name }}
            - --registry-config=/registry/config.json
            {{- end }}
            - {{ .Values.package.reference | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
            {{- if .Values.package.registryConfigSecret.name }}
            - name: registry-config
              mountPath: /registry
              readOnly: true
            {{- end }}
            - name: temporary
              mountPath: /tmp
        - name: verify-package-envelope
          image: {{ required "images.runtime is required" .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - verify-envelope
            - --oci-manifest=/package/oci-manifest.json
            - --package-digest={{ regexFind "sha256:[0-9a-f]{64}$" .Values.package.reference }}
            - --manifest-sha256={{ .Values.package.manifestSHA256 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
              readOnly: true
            - name: temporary
              mountPath: /tmp
        {{- if eq .Values.trust.mode "cosign-key" }}
        - name: verify-package-signature
          image: {{ required "images.cosign is required for cosign-key trust" .Values.images.cosign | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - verify-blob
            - --insecure-ignore-tlog
            - --key=/trust/{{ .Values.trust.cosign.publicKeySecret.key }}
            - --bundle=/signature/{{ .Values.trust.cosign.signatureBundleSecret.key }}
            - /package/oci-manifest.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
              readOnly: true
            - name: trust
              mountPath: /trust
              readOnly: true
            - name: signature-bundle
              mountPath: /signature
              readOnly: true
            - name: temporary
              mountPath: /tmp
        {{- end }}
        - name: pull-package
          image: {{ required "images.oras is required" .Values.images.oras | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - pull
            - --no-tty
            - --output=/package
            {{- if .Values.package.plainHTTP }}
            - --plain-http
            {{- end }}
            {{- if .Values.package.registryConfigSecret.name }}
            - --registry-config=/registry/config.json
            {{- end }}
            - {{ .Values.package.reference | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
            {{- if .Values.package.registryConfigSecret.name }}
            - name: registry-config
              mountPath: /registry
              readOnly: true
            {{- end }}
            - name: temporary
              mountPath: /tmp
        - name: validate-package
          image: {{ required "images.runtime is required" .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - validate
            {{- include "native-plugin-runtime.commonArgs" . | nindent 12 }}
            - --trust-state={{ if eq .Values.trust.mode "cosign-key" }}verified-local-key{{ else }}untrusted-development{{ end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
            - name: temporary
              mountPath: /tmp
      containers:
        - name: migrate
          image: {{ required "images.runtime is required" .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - run
            {{- include "native-plugin-runtime.commonArgs" . | nindent 12 }}
            - --plugin-state=/state
          env:
            - name: STELLWERK_PLUGIN_CONFIG_FILE
              value: /run/secrets/stellwerk-plugin-migration/profile.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: package
              mountPath: /package
              readOnly: true
            - name: state
              mountPath: /state
            - name: temporary
              mountPath: /tmp
            - name: migration-profile
              mountPath: /run/secrets/stellwerk-plugin-migration/profile.json
              subPath: profile.json
              readOnly: true
            - name: migration-database
              mountPath: /run/secrets/stellwerk-plugin-migration/database-url
              subPath: database-url
              readOnly: true
            {{- if $databaseCASecret }}
            - name: migration-database-ca
              mountPath: /run/config/database-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: package
          emptyDir:
            sizeLimit: {{ .Values.packageVolume.sizeLimit }}
        - name: state
          emptyDir:
            sizeLimit: {{ .Values.stateVolume.sizeLimit }}
        - name: temporary
          emptyDir:
            sizeLimit: 16Mi
        - name: migration-profile
          secret:
            secretName: {{ $profileSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.migration.profileSecret.key }}
                path: profile.json
        - name: migration-database
          secret:
            secretName: {{ $databaseSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.migration.databaseSecret.key }}
                path: database-url
        {{- if $databaseCASecret }}
        - name: migration-database-ca
          secret:
            secretName: {{ $databaseCASecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.migration.databaseCASecret.key }}
                path: ca.crt
        {{- end }}
        {{- if eq .Values.trust.mode "cosign-key" }}
        - name: trust
          secret:
            secretName: {{ required "trust.cosign.publicKeySecret.name is required" .Values.trust.cosign.publicKeySecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.trust.cosign.publicKeySecret.key }}
                path: {{ .Values.trust.cosign.publicKeySecret.key }}
        - name: signature-bundle
          secret:
            secretName: {{ required "trust.cosign.signatureBundleSecret.name is required" .Values.trust.cosign.signatureBundleSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.trust.cosign.signatureBundleSecret.key }}
                path: {{ .Values.trust.cosign.signatureBundleSecret.key }}
        {{- end }}
        {{- if .Values.package.registryConfigSecret.name }}
        - name: registry-config
          secret:
            secretName: {{ .Values.package.registryConfigSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.package.registryConfigSecret.key }}
                path: config.json
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
