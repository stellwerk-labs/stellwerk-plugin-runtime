{{- if and .Values.enabled (gt (int .Values.replicaCount) 1) }}
# Voluntary disruptions (node drains) keep one replica serving. Unhealthy
# replicas stay evictable so a broken Pod cannot block a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "native-plugin-runtime.fullname" . }}
  labels:
    {{- include "native-plugin-runtime.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "native-plugin-runtime.runtimeSelectorLabels" . | nindent 6 }}
{{- end }}
