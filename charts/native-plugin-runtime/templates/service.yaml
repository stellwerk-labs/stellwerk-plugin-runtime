{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "native-plugin-runtime.fullname" . }}
  labels:
    {{- include "native-plugin-runtime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "native-plugin-runtime.runtimeSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.plugin.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.ui.enabled }}
    - name: ui
      port: {{ .Values.ui.port }}
      targetPort: ui
      protocol: TCP
    {{- end }}
{{- end }}
