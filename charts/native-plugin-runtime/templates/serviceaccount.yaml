{{- if and .Values.enabled .Values.runtime.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "native-plugin-runtime.fullname" . }}
  labels:
    {{- include "native-plugin-runtime.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.enabled .Values.migration.enabled .Values.migration.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "native-plugin-runtime.fullname" . }}-migration
  labels:
    {{- include "native-plugin-runtime.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- with .Values.migration.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
