# The chart is inert unless an operator supplies all immutable package inputs.
enabled: false

plugin:
  id: ""
  version: ""
  port: 8080

# Generic static serving uses the same runtime image and signed package. TLS
# terminates at the Console Gateway; no backend credentials enter this container.
ui:
  enabled: false
  port: 8081
  consoleOrigin: ""
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {cpu: 200m, memory: 192Mi}
  gateway:
    enabled: false
    className: ""
    hostname: ""
    certificateSecretName: ""
    # Leave empty to use an existing certificate Secret. Otherwise create a
    # Certificate through the already-installed cert-manager issuer.
    issuerName: ""
    issuerKind: ClusterIssuer

# Runtime serving is a separate installer phase from migration. The installer
# must keep this false until the matching migration Job has succeeded.
runtime:
  enabled: true

migration:
  enabled: false
  activeDeadlineSeconds: 300
  backoffLimit: 2
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # Operator-created mode:native-migrate profile. It must refer to the fixed
  # migrationDatabaseUrlFile path below and contain no runtime credentials.
  profileSecret:
    name: ""
    key: profile.json
  # Dedicated migration principal, never the runtime database Secret.
  databaseSecret:
    name: ""
    key: database-url
  # Optional public CA for verify-full migration database transport. Mounted
  # only in migrate, never package init containers, at the fixed path below.
  databaseCASecret:
    name: ""
    key: ca.crt

package:
  # OCI registry reference. Enabled installations require an @sha256 digest.
  reference: ""
  manifestSHA256: ""
  plainHTTP: false
  # Digest an existing installation recorded (set by the installer after the
  # first successful install). Re-fetching exactly this digest keeps verifying
  # after the signing key's validity window ended; revocation still blocks it.
  # Any other digest is a new installation and needs a currently valid key.
  installedDigest: ""
  # managed-key-no-tlog: digests of the signed SBOM and source provenance
  # referrers attest-layout-manifest.sh attached to the package (release.json
  # .attestations.<name>.digest), pulled from the package repository. A
  # publisher that requires an attestation fails closed without it.
  attestations:
    sbom: ""
    provenance: ""
  # Optional dockerconfigjson Secret for the registry (usually the customer's
  # mirror). Mounted only into the ORAS fetch init containers.
  registryConfigSecret:
    name: ""
    key: .dockerconfigjson

trust:
  # Required for an enabled installation, there is no default:
  # managed-key-no-tlog, or development-untrusted for local development. The
  # development profile is visible to the plugin and must never be presented
  # as production verification.
  mode: ""
  # Authentic trust bootstrap (publishers.json): publishers, their policy,
  # plugin IDs, pinned keys with validity and the revokedKeyIds compromise
  # list. Delivered by the operator, never taken from a package. Mounted only
  # into the verify-package-publisher init container. Read at Pod start: a
  # changed bootstrap (rotation, revocation) applies to Pods started after
  # the change, so roll the Deployment to apply it.
  bootstrapSecret:
    name: ""
    key: publishers.json
  # Detached Sigstore bundle from sign-layout-manifest.sh over the exact OCI
  # manifest whose digest is pinned in package.reference.
  signatureBundleSecret:
    name: ""
    key: oci-manifest.sigstore.json

images:
  # Enabled installations require immutable @sha256 references.
  runtime: ""
  oras: ""
  cosign: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Workload token exchange (v1alpha). A core-token sidecar
# presents a projected ServiceAccount token to IAM through the Core gateway
# before the plugin starts and keeps the issued short-lived Core token fresh
# in a memory-backed file named by STELLWERK_CORE_TOKEN_FILE. Only the
# sidecar mounts the Kubernetes token. Needs Kubernetes 1.29+, the chart's own
# ServiceAccount and an IAM workload binding for exactly that ServiceAccount.
workloadIdentity:
  enabled: false
  # Exchange audience of the IAM workload binding. Required when enabled.
  audience: ""
  # Projected token lifetime: Kubernetes requires at least 600 seconds and the
  # exchange contract allows at most 600.
  expirationSeconds: 600
  gateway:
    # https origin of the Core gateway routing /auth/plugin-workload-token to
    # IAM. Required when enabled.
    url: ""
    # Optional public CA bundle for the gateway certificate; replaces the
    # system roots when set.
    caSecret:
      name: ""
      key: ca.crt
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}

podAnnotations: {}
podLabels: {}

# The launcher executes a sealed in-memory copy of the plugin executable, so
# the memory limit must cover executable size plus the plugin's working set.
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi

initResources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Every replica fetches its own copy into this emptyDir; the plugin and UI
# mount it read-only. The limit covers the largest package the envelope admits.
packageVolume:
  sizeLimit: 640Mi

# Bounds the plugin state emptyDir used when persistence is disabled, and the
# migration Job's state directory.
stateVolume:
  sizeLimit: 128Mi

persistence:
  enabled: false
  size: 1Gi
  storageClassName: ""

service:
  type: ClusterIP

probes:
  path: /health
  scheme: HTTP
  startup:
    failureThreshold: 30
    periodSeconds: 2
  readiness:
    periodSeconds: 5
  liveness:
    periodSeconds: 10

terminationGracePeriodSeconds: 10

# Only these explicitly supplied names reach the executable. The launcher also
# filters its process environment to STELLWERK_PLUGIN_*, OTEL_*, SSL_CERT_FILE and
# STELLWERK_CORE_TOKEN_FILE, which workloadIdentity sets.
pluginEnv: []

# Operator-owned configuration mounted only into the plugin container. Use a
# STELLWERK_PLUGIN_* environment variable to tell the executable where its
# profile lives. Keep database URLs and verification keys in separate Secrets
# so they can have independent ownership and rotation policies.
pluginSecretFiles: []
#  - name: plugin-profile
#    secretName: plugin-profile
#    mountPath: /var/run/secrets/stellwerk/plugin-profile
#    items:
#      - key: profile.json
#        path: profile.json

networkPolicy:
  enabled: true
  # Only the configured Core gateway may call the plugin.
  ingressGateway:
    namespaceSelector:
      kubernetes.io/metadata.name: platform-orchestrator
    podSelector:
      app.kubernetes.io/name: control-plane
      app.kubernetes.io/instance: platform-orchestrator
  # Plugin callbacks use the authenticated HTTPS backend Gateway. The service
  # listens on 443; NetworkPolicy must name the selected proxy Pod's target
  # port (10443 for the EnvoyProxy profile shipped with the Stellwerk chart).
  # Override all three selectors/port when the Gateway implementation differs.
  coreGateway:
    namespaceSelector:
      kubernetes.io/metadata.name: envoy-gateway-system
    podSelector:
      gateway.envoyproxy.io/owning-gateway-namespace: platform-orchestrator
      gateway.envoyproxy.io/owning-gateway-name: platform-orchestrator-backend-gateway
    port: 10443
  # The plugin database must use its own database and runtime principal even
  # when it shares a PostgreSQL cluster with Core services.
  database:
    namespaceSelector:
      kubernetes.io/metadata.name: platform-orchestrator
    podSelector:
      cnpg.io/cluster: platform-orchestrator-cnpg-databases
    port: 5432
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # The customer's registry mirror endpoints for the fetch init containers.
  # Each entry is one address ({cidr: 192.0.2.10/32, port: 443}) or an exact
  # in-cluster peer ({namespaceSelector: {...}, podSelector: {...}, port: 5000}).
  # Nothing is open by default, so fetching fails closed until set. The rule
  # is Pod-wide: the plugin can reach these endpoints but holds no credentials.
  registryMirrors: []
  additionalIngress: []
  additionalEgress: []

nodeSelector: {}
tolerations: []
affinity: {}
